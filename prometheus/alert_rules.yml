groups:
  - name: gridnode_alerts
    rules:
      - alert: HighApiErrorRate
        expr: sum(rate(http_request_duration_seconds_count{code=~"5.."}[5m])) / sum(rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High API 5xx error rate detected"
          description: "Over 5% of requests to the backend in the last 5m resulted in 5xx errors."

      - alert: HighApiLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API 95th percentile latency is high"
          description: "95th percentile latency for backend API is > 2s for 2m."

      - alert: NodeEventLoopLag
        expr: nodejs_eventloop_lag_seconds > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High Event Loop Lag"
          description: "Node.js event loop lag is > 100ms, indicating CPU saturation or blocking operations."

      - alert: PostgresHighConnectionUsage
        # Alert if connection usage exceeds 80% of max_connections (db.t4g.micro typically ~80 max_connections)
        expr: sum(pg_stat_activity_count) / sum(pg_settings_max_connections) > 0.80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Postgres Connection Pool Exhaustion Risk"
          description: "RDS Postgres connections are > 80% of max_connections. Risk of connection drops under load spikes."
