name: Deploy

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Images to ECR
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
        
      - name: Build and Push Backend
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ./be
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/gridnode-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ./fe
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/gridnode-fe:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
          
      - name: Trigger App Restart on EC2 via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=gridnode-orchestrator" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          
          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Error: Could not find a running gridnode-orchestrator instance."
            exit 1
          fi

          echo "Deploying to instance: $INSTANCE_ID"
          
          # Encode the docker-compose.yml file from the repository to prevent injection/escaping issues
          # Note: Must create a docker-compose.yml in the repo root
          if [ ! -f docker-compose.yml ]; then echo "docker-compose.yml not found"; exit 1; fi
          B64_COMPOSE=$(cat docker-compose.yml | base64 -w 0)
          
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com"
          
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"cd /opt/gridnode\",
              \"echo '$B64_COMPOSE' | base64 -d > docker-compose.yml\",
              \"export IMAGE_TAG=${{ github.sha }}\",
              \"export ECR_REGISTRY=$ECR_REGISTRY\",
              \"aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"docker compose pull\",
              \"docker compose up -d\"
            ]"

      - name: Post-deploy Health Check
        run: |
          # Poll the orchestrator to ensure it comes up successfully.
          # We use SSM to curl from inside the instance, which respects the
          # Zero-Inbound posture (if we remove port 80/443 public ingress later).
          #
          # Ports must match docker-compose.yml: the backend publishes 3005 and
          # serves /health; the frontend publishes host port 80 and serves
          # /api/health. Checking both means a half-up stack fails the gate.
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=gridnode-orchestrator" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)

          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Error: Could not find a running gridnode-orchestrator instance."
            exit 1
          fi

          echo "Waiting for application to become healthy..."

          # Poll for up to 3 minutes
          MAX_RETRIES=18
          RETRY_COUNT=0

          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            # Using SSM to execute the curl inside the EC2 instance securely
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[\"curl -sf http://localhost:3005/health && curl -sf http://localhost:80/api/health\"]" \
              --query "Command.CommandId" --output text)

            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)

            if [ "$STATUS" == "Success" ]; then
              echo "Health check passed!"
              exit 0
            fi

            echo "Health check $STATUS... retrying in 10s"
            sleep 10
            # Note: (( )) returns non-zero when the result is 0, which aborts the
            # step under `bash -e`. Use arithmetic assignment instead.
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done

          echo "Health check failed after 3 minutes."
          exit 1
